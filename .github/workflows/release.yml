name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TrashDunk ${{ github.ref_name }} 🏀"
          tag_name: ${{ github.ref_name }}
          files: |
            dist-desktop/TrashDunk.exe
          body: |
            ## 🏀 TrashDunk ${{ github.ref_name }}

            Dernière version officielle de **TrashDunk** pour Windows 10 & 11 !

            ### ✨ Nouveautés & Fonctionnalités :
            - 🏆 **Camp d'entraînement :** Mini-jeu progressif en 5 niveaux avec objectifs, chronomètre et HUD.
            - 📁 **Support complet des dossiers :** Envoyez des répertoires entiers au panier via le clic droit.
            - 🏀 **Multi-sélection Windows :** Accumulation transparente de plusieurs fichiers sélectionnés en un seul shoot.
            - ⚙️ **Barre des tâches & Veille :** Persistance discrète en tâche de fond dans la zone de notification.
            - 🗑️ **Corbeille native :** Suppression sécurisée réversible via l'API Win32 Recycle Bin.

            ### 📦 Téléchargement direct :
            Téléchargez `TrashDunk.exe` ci-dessous et lancez-le directement.
