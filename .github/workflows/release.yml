name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TrashDunk v1.0.0 — Premier shoot sur Windows 🏀"
          tag_name: ${{ github.ref_name }}
          files: |
            dist-desktop/TrashDunk.exe
          body: |
            ## 🏀 TrashDunk v1.0.0

            Première version officielle de **TrashDunk**, l'utilitaire qui transforme la suppression de fichier sous Windows en véritable mini-jeu de basket !

            ### ✨ Fonctionnalités :
            - 🖱️ **Intégration Explorateur Windows :** Verbe de clic droit « Dunk it 🏀 » et raccourci clavier `Ctrl + Maj + D`.
            - 🎯 **Mini-Jeu de Shoot :** Traction, jauge de timing oscillante et tir en parabole.
            - 🗑️ **Sécurité totale :** En cas de Swish réussi, le fichier est déplacé dans la corbeille Windows standard (restauration possible). En cas d'échec ou avec la touche Échap, le fichier reste intact sur votre bureau.
            - ❄️ **Célébration COLD :** Double swish consécutif avec gel de l'écran et sticker exclusif !
            - 🔥 **Sunset Glow :** Triple panier consécutif avec bonus et multiplicateurs de streak.

            ### 📦 Téléchargement direct :
            Téléchargez le fichier `TrashDunk.exe` ci-dessous et lancez-le directement.
